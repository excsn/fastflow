[workspace]
resolver = "3"
members = ["fastflow_*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MPL-2.0"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
core-foundation = "0.10"
core-graphics = "0.25"
fastflow_capture = { path = "fastflow_capture" }
fastflow_core = { path = "fastflow_core" }
fastflow_daemon = { path = "fastflow_daemon" }
fastflow_desktop = { path = "fastflow_desktop" }
fast_image_resize = "6"
global-hotkey = "0.8"
libc = "0.2"
fastflow_render = { path = "fastflow_render" }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-av-foundation = { version = "0.3", features = ["block2", "objc2-core-media"] }
objc2-av-kit = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
png = "0.18"
dispatch2 = "0.3"
fibre = { version = "0.6", default-features = false }
block2 = "0.6"
serde = { version = "1", features = ["derive"] }
proptest = "1"
serde_json = "1"
toml = "1"
tray-icon = "0.25"
winit = "0.30"

[profile.release]
debug = true
